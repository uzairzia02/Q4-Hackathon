openapi: 3.0.0
info:
  title: Physical AI Book API
  version: 1.0.0
paths:
  /api/chat:
    post:
      summary: Interact with the RAG chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                context:
                  type: string
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
  /api/users/{user_id}/profile:
    get:
      summary: Get user profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Update user profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: A successful response
  /api/embeddings/sync:
    post:
      summary: Trigger a manual sync of embeddings
      responses:
        '202'
          description: Sync process accepted

components:
  schemas:
    UserProfile:
      type: object
      properties:
        hardware_tier:
          type: string
        experience_level:
          type: string
        learning_goals:
          type: array
          items:
            type: string
